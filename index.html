<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ozbolat Lab Booking</title>
<link rel="icon" type="image/png" href="favicon.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0f6e56" />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f4f0;
    --surface: #ffffff;
    --border: rgba(0,0,0,0.09);
    --border-strong: rgba(0,0,0,0.16);
    --text: #1a1a18;
    --text-muted: #6b6a65;
    --text-hint: #9e9c96;
    --accent: #0f6e56;
    --accent-light: #e1f5ee;
    --accent-text: #085041;
    --danger: #993c1d;
    --danger-light: #faece7;
    --info: #185fa5;
    --info-light: #e6f1fb;
    --amber: #854f0b;
    --amber-light: #faeeda;
    --radius: 10px;
    --radius-sm: 6px;
  }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 1.5rem 1rem 4rem; }
  .page { max-width: 960px; margin: 0 auto; }

  /* HEADER */
  .site-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 1.5rem; gap: 12px; flex-wrap: wrap; }
  .site-header h1 { font-size: 20px; font-weight: 500; }
  .site-header p { font-size: 13px; color: var(--text-muted); margin-top: 3px; }
  .header-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; padding: 5px 11px; background: var(--accent-light); color: var(--accent-text); border-radius: 99px; white-space: nowrap; }
  .dot { width: 7px; height: 7px; background: var(--accent); border-radius: 50%; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.35} }

  /* TABS */

  /* LAYOUT */
  .main-layout { display: grid; grid-template-columns: 1fr 340px; gap: 16px; align-items: start; }
  .left-col { display: flex; flex-direction: column; gap: 16px; }

  /* CALENDAR */
  .calendar-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .cal-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .cal-nav { display: flex; align-items: center; gap: 8px; }
  .cal-nav-btn { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--border); background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text-muted); transition: background 0.12s; }
  .cal-nav-btn:hover { background: var(--bg); }
  .cal-title { font-size: 14px; font-weight: 500; min-width: 160px; text-align: center; }
  .cal-today-btn { font-size: 12px; padding: 4px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: transparent; cursor: pointer; color: var(--text-muted); transition: background 0.12s; }
  .cal-today-btn:hover { background: var(--bg); }

  /* Cabinet filter pills */
  .cab-filter { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 16px; border-bottom: 1px solid var(--border); }
  .cab-pill { font-size: 11px; font-weight: 500; padding: 3px 10px; border-radius: 99px; cursor: pointer; border: 1.5px solid transparent; transition: all 0.12s; white-space: nowrap; }
  .cab-pill.off { opacity: 0.35; }

  /* Day view grid — cabinets as columns */
  .day-grid { display: grid; grid-template-columns: 48px repeat(3, 1fr); position: relative; }
  .cab-col-header { text-align: center; padding: 8px 4px; border-bottom: 1px solid var(--border); border-left: 1px solid var(--border); font-size: 11px; font-weight: 500; line-height: 1.3; }
  .cab-col-header:first-child { border-left: none; }
  .time-gutter { grid-column: 1; }
  .time-slot-label { height: 48px; display: flex; align-items: flex-start; justify-content: flex-end; padding-right: 8px; padding-top: 2px; font-size: 10px; color: var(--text-hint); font-family: 'DM Mono', monospace; }
  .day-col { border-left: 1px solid var(--border); position: relative; }
  .hour-cell { height: 48px; border-bottom: 1px solid var(--border); position: relative; }
  .booking-block { position: absolute; left: 2px; right: 2px; border-radius: 4px; padding: 3px 6px; overflow: hidden; cursor: pointer; z-index: 2; transition: box-shadow 0.12s; }
  .booking-block:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.15); z-index: 10; }
  .bb-name { font-size: 11px; font-weight: 500; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bb-time { font-size: 10px; opacity: 0.8; font-family: 'DM Mono', monospace; white-space: nowrap; }
  /* Tooltip */
  .bb-tooltip { display:none; position:fixed; background:var(--text); color:#fff; font-size:12px; padding:8px 12px; border-radius:8px; z-index:1000; max-width:220px; line-height:1.5; pointer-events:none; }
  .bb-tooltip.show { display:block; }
  .now-banner-wrap { display:flex; gap:8px; flex-wrap:wrap; }
  .now-item { display:inline-flex; align-items:center; gap:7px; font-size:12px; font-weight:500; padding:5px 11px; border-radius:99px; white-space:nowrap; }
  .now-dot-pulse { width:7px; height:7px; border-radius:50%; animation:pulse 1.5s infinite; }
  .now-line { position: absolute; left: 0; right: 0; height: 2px; background: #e24b4a; z-index: 5; pointer-events: none; }
  .now-dot { position: absolute; left: -4px; top: -4px; width: 8px; height: 8px; border-radius: 50%; background: #e24b4a; }

  /* FORM PANEL */
  .form-panel { display: flex; flex-direction: column; gap: 14px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem; }
  .card-title { font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-hint); margin-bottom: 1rem; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-group { display: flex; flex-direction: column; gap: 5px; }
  label { font-size: 12px; font-weight: 500; color: var(--text-muted); }
  input, textarea, select { font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 10px; width: 100%; outline: none; transition: border-color 0.15s; -webkit-appearance: none; appearance: none; }
  input[type="date"], input[type="time"] { -webkit-appearance: none; appearance: none; font-size: 14px; padding: 8px 10px; }
  input:focus, textarea:focus, select:focus { border-color: var(--accent); background: #fff; }
  textarea { resize: vertical; min-height: 60px; }
  .err { font-size: 11px; color: var(--danger); display: none; margin-top: 2px; }
  .conflict-banner { display: none; background: var(--danger-light); border: 1.5px solid #f0997b; border-radius: var(--radius-sm); padding: 10px 12px; margin-top: 2px; }
  .conflict-banner strong { display: block; font-size: 13px; font-weight: 500; color: #712b13; margin-bottom: 3px; }
  .conflict-banner p { font-size: 12px; color: var(--danger); line-height: 1.5; }
  .submit-btn { width: 100%; padding: 10px; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500; background: var(--accent); color: #fff; border: none; border-radius: var(--radius-sm); cursor: pointer; transition: opacity 0.15s; margin-top: 4px; }
  .submit-btn:hover { opacity: 0.88; }
  .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* LIST VIEW */
  .search-wrap { position: relative; margin-bottom: 12px; }
  .search-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); pointer-events: none; }
  .search-input { font-size: 13px; padding: 8px 10px 8px 32px; width: 100%; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); color: var(--text); outline: none; -webkit-appearance: none; }
  .search-input:focus { border-color: var(--accent); }
  .empty-state { text-align: center; padding: 2rem 1rem; font-size: 13px; color: var(--text-hint); border: 1.5px dashed var(--border); border-radius: var(--radius); }
  .empty-state strong { display: block; font-size: 14px; font-weight: 500; color: var(--text-muted); margin-bottom: 4px; }
  .entry-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.9rem 1.1rem; margin-bottom: 8px; display: flex; gap: 12px; animation: fadeIn 0.2s ease; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none} }
  .avatar { width: 36px; height: 36px; min-width: 36px; border-radius: 50%; background: var(--info-light); color: var(--info); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500; font-family: 'DM Mono', monospace; }
  .entry-body { flex: 1; min-width: 0; }
  .entry-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .entry-name { font-size: 14px; font-weight: 500; }
  .entry-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 5px; }
  .meta-tag { font-size: 11px; padding: 2px 8px; border-radius: var(--radius-sm); background: var(--bg); color: var(--text-muted); border: 1px solid var(--border); font-family: 'DM Mono', monospace; white-space: nowrap; }
  .cabinet-tag { font-size: 11px; padding: 2px 8px; border-radius: var(--radius-sm); background: var(--amber-light); color: var(--amber); font-weight: 500; white-space: nowrap; }
  .entry-notes { font-size: 12px; color: var(--text-muted); margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--border); line-height: 1.5; }
  .delete-btn { font-size: 11px; padding: 3px 9px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: transparent; color: var(--text-hint); cursor: pointer; white-space: nowrap; transition: background 0.12s, color 0.12s; }
  .delete-btn:hover { background: var(--danger-light); color: var(--danger); border-color: transparent; }
  .edit-btn { font-size: 11px; padding: 3px 9px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: transparent; color: var(--text-hint); cursor: pointer; white-space: nowrap; transition: background 0.12s, color 0.12s; }
  .edit-btn:hover { background: var(--info-light); color: var(--info); border-color: transparent; }
  .edit-modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.35); z-index:200; align-items:center; justify-content:center; }
  .edit-modal-overlay.open { display:flex; }
  .edit-modal { background:var(--surface); border-radius:var(--radius); padding:1.5rem; width:100%; max-width:420px; margin:1rem; box-shadow:0 8px 32px rgba(0,0,0,0.15); }
  .edit-modal h3 { font-size:15px; font-weight:500; margin-bottom:1rem; }
  .edit-modal .form-group { margin-bottom:10px; }
  .edit-modal-footer { display:flex; gap:8px; margin-top:1rem; }
  .edit-modal-footer button { flex:1; padding:9px; font-size:13px; font-weight:500; border-radius:var(--radius-sm); border:none; cursor:pointer; }
  .btn-save { background:var(--accent); color:#fff; }
  .btn-save:hover { opacity:0.88; }
  .btn-cancel { background:var(--bg); color:var(--text-muted); border:1px solid var(--border) !important; }
  .btn-remove { background:var(--danger-light); color:var(--danger); border:1px solid transparent !important; }
  .btn-remove:hover { opacity:0.85; }

  .status-bar { font-size: 11px; color: var(--text-hint); display: flex; align-items: center; gap: 5px; margin-bottom: 10px; }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .status-dot.offline { background: #ccc; }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--text); color: #fff; font-size: 13px; padding: 10px 20px; border-radius: 99px; opacity: 0; pointer-events: none; transition: opacity 0.2s; white-space: nowrap; z-index: 99; }
  .toast.show { opacity: 1; }
  .footer { margin-top: 2rem; text-align: center; font-size: 12px; color: var(--text-hint); }


  /* View toggle */
  .view-toggle { display:flex; gap:4px; }
  .vt-btn { font-size:12px; padding:4px 12px; border-radius:var(--radius-sm); border:1px solid var(--border); background:transparent; cursor:pointer; color:var(--text-muted); transition:all 0.12s; }
  .vt-btn.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  .vt-btn:hover:not(.active) { background:var(--bg); }
  /* Week grid */
  .week-day-header { text-align:center; padding:7px 4px; border-left:1px solid var(--border); font-size:11px; font-weight:500; line-height:1.4; cursor:pointer; }
  .week-day-header:first-child { border-left:none; }
  .week-day-header.today { color:var(--accent); background:var(--accent-light); }
  @media (max-width: 720px) {
    .main-layout { grid-template-columns: 1fr; }
    .form-panel { order: 1; }
    #calendar-view { order: -2; }
    #list-view { order: 2; }
    .left-col { display: contents; }
    input[type="date"], input[type="time"] { font-size: 14px !important; padding: 8px 10px !important; }
    .site-header { flex-direction: column; align-items: flex-start; gap: 8px; }
    .site-header img { height: 40px !important; }
    body { padding: 1rem 0.75rem 3rem; }
    .page { max-width: 100%; }
    #cal-scroll { max-height: 420px !important; }
    .vt-btn { font-size: 11px; padding: 3px 9px; }
    .cal-today-btn { font-size: 11px; }
  }
  @media (max-width: 480px) {
    .form-grid { grid-template-columns: 1fr; }
    .day-grid { grid-template-columns: 36px repeat(3, 1fr); }
    .cab-col-header { font-size: 9px; padding: 6px 2px; }
    .week-day-header { font-size: 9px; padding: 5px 2px; }
    .cal-title { font-size: 12px; min-width: 120px; }
    .cal-nav { gap: 4px; }
    .entry-card { flex-direction: column; gap: 8px; }
    .submit-btn { font-size: 13px; }
    .card { padding: 1rem; }
    #cal-scroll { max-height: 380px !important; }
  }
</style>
</head>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, push, onValue, remove, update, query, orderByChild, startAt } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAyb9IDluuRtB55MiLdbkdWj8gblYoXaYI",
    authDomain: "ozbolat-lab.firebaseapp.com",
    databaseURL: "https://ozbolat-lab-default-rtdb.firebaseio.com",
    projectId: "ozbolat-lab",
    storageBucket: "ozbolat-lab.firebasestorage.app",
    messagingSenderId: "820651485978",
    appId: "1:820651485978:web:4370d3d36cc9679b231aa3"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const bookingsRef = ref(db, 'bookings');

  // Cabinet colours
  const CABINETS = [
    { name: "Cell Culture Room – Left",  color: "#185fa5", bg: "#e6f1fb" },
    { name: "Cell Culture Room – Right", color: "#0f6e56", bg: "#e1f5ee" },
    { name: "iPSC Room",                 color: "#7f77dd", bg: "#eeedfe" },
  ];
  function cabStyle(name) {
    return CABINETS.find(c => c.name === name) || { color: "#6b6a65", bg: "#f1efe8" };
  }



  let allEntries = [];
  let dayOffset = 0;

  const tooltip = document.createElement('div');
  tooltip.className = 'bb-tooltip';
  document.body.appendChild(tooltip);
  document.addEventListener('mousemove', e => {
    tooltip.style.left = (e.clientX + 14) + 'px';
    tooltip.style.top  = (e.clientY + 14) + 'px';
  });

  function getInitials(name) { return name.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
  function formatDate(d) {
    if (!d) return '';
    const [y,m,day] = d.split('-');
    const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return months[parseInt(m)-1]+' '+parseInt(day)+', '+y;
  }
  function formatTime(t) {
    if (!t) return '';
    let [h,min] = t.split(':'); h=parseInt(h);
    const ampm = h>=12?'PM':'AM'; h=h%12||12;
    return h+':'+min+' '+ampm;
  }
  function timeToMins(t) { const [h,m]=t.split(':'); return parseInt(h)*60+parseInt(m); }
  function showToast(msg) {
    const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show');
    setTimeout(()=>el.classList.remove('show'),2200);
  }
  function setStatus(ok) {
    document.getElementById('status-dot').className='status-dot'+(ok?'':' offline');
    document.getElementById('status-text').textContent=ok?'Live — shared with all lab members':'Offline';
  }
  function showConflict(msg) {
    const el=document.getElementById('conflict-banner');
    document.getElementById('conflict-msg').textContent=msg;
    el.style.display='block';
    setTimeout(()=>el.style.display='none',6000);
  }
  function toYMD(d) {
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  function getSelectedDate() {
    const d = new Date();
    d.setDate(d.getDate() + dayOffset);
    return d;
  }

  const HOUR_START = 7;
  const HOUR_END   = 22;
  const HOUR_HEIGHT = 48;

  window.renderCalendar = function renderCalendar() {
    if (calView === 'week') { window.renderWeek(); return; }
    const selDate = getSelectedDate();
    const ymd = toYMD(selDate);
    const todayYMD = toYMD(new Date());
    const isToday = ymd === todayYMD;
    const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const DAY_NAMES=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    document.getElementById('cal-title').textContent =
      (isToday?'Today — ':'')+DAY_NAMES[selDate.getDay()]+', '+months[selDate.getMonth()]+' '+selDate.getDate()+', '+selDate.getFullYear();

    const grid = document.getElementById('day-grid');
    grid.innerHTML = '';
    grid.style.gridTemplateColumns = '48px repeat('+CABINETS.length+', 1fr)';

    const hdrGrid = document.getElementById('day-grid-header');
    hdrGrid.innerHTML = '';
    hdrGrid.style.gridTemplateColumns = '48px repeat('+CABINETS.length+', 1fr)';
    const corner = document.createElement('div');
    corner.style.cssText = 'width:48px;min-width:48px;';
    hdrGrid.appendChild(corner);
    CABINETS.forEach(c => {
      const hdr = document.createElement('div');
      hdr.className = 'cab-col-header';
      hdr.style.color = c.color;
      hdr.style.background = c.bg;
      hdr.style.borderBottom = 'none';
      hdr.textContent = c.name;
      hdrGrid.appendChild(hdr);
    });

    const gutter = document.createElement('div');
    gutter.className = 'time-gutter';
    for (let h=HOUR_START; h<=HOUR_END; h++) {
      const lbl = document.createElement('div');
      lbl.className = 'time-slot-label';
      lbl.textContent = h===12?'12pm':h<12?h+'am':(h-12)+'pm';
      gutter.appendChild(lbl);
    }
    grid.appendChild(gutter);

    CABINETS.forEach(c => {
      const col = document.createElement('div');
      col.className = 'day-col';
      col.style.position = 'relative';
      for (let h=HOUR_START; h<=HOUR_END; h++) {
        const cell = document.createElement('div');
        cell.className = 'hour-cell';
        col.appendChild(cell);
      }
      const cabEntries = allEntries.filter(e => e.date === ymd && e.cabinet === c.name);
      cabEntries.forEach(e => {
        const startMins = timeToMins(e.start);
        const endMins   = timeToMins(e.end);
        const top    = (startMins - HOUR_START*60) / 60 * HOUR_HEIGHT;
        const height = Math.max((endMins - startMins) / 60 * HOUR_HEIGHT, 20);
        if (top < 0 || top > (HOUR_END - HOUR_START) * HOUR_HEIGHT) return;
        const block = document.createElement('div');
        block.className = 'booking-block';
        block.style.cssText = 'top:'+top+'px;height:'+height+'px;background:'+c.bg+';border-left:3px solid '+c.color+';left:2px;right:2px;';
        block.innerHTML = '<div class="bb-name" style="color:'+c.color+'">'+e.name+'</div><div class="bb-time" style="color:'+c.color+'">'+formatTime(e.start)+'–'+formatTime(e.end)+'</div>';
        const tip = '<b>'+e.name+'</b><br>'+e.cabinet+'<br>'+formatTime(e.start)+' – '+formatTime(e.end)+(e.notes?'<br>'+e.notes:'')+'<br><span style="opacity:0.6;font-size:11px">Click to edit</span>';
        block.addEventListener('mouseenter', () => { tooltip.innerHTML=tip; tooltip.classList.add('show'); });
        block.addEventListener('mouseleave', () => tooltip.classList.remove('show'));
        block.addEventListener('click', () => { tooltip.classList.remove('show'); window._editEntry(e.fbKey); });
        col.appendChild(block);
      });
      if (isToday) {
        const now = new Date();
        const nowMins = now.getHours()*60+now.getMinutes();
        const nowTop = (nowMins-HOUR_START*60)/60*HOUR_HEIGHT;
        if (nowTop>=0 && nowTop<=(HOUR_END-HOUR_START)*HOUR_HEIGHT) {
          const line = document.createElement('div');
          line.className = 'now-line';
          line.style.top = nowTop+'px';
          line.innerHTML = '';
          col.appendChild(line);
        }
      }
      grid.appendChild(col);
    });

    const scrollEl = document.getElementById('cal-scroll');
    if (scrollEl.scrollTop === 0) scrollEl.scrollTop = (8-HOUR_START)*HOUR_HEIGHT;
    if (!scrollEl._syncBound) {
      scrollEl._syncBound = true;
      scrollEl.addEventListener('scroll', () => {
        document.getElementById('cal-header-row').scrollLeft = scrollEl.scrollLeft;
      });
    }
  };

  let calView = 'day'; // 'day' | 'week'

  window.setView = function(v) {
    calView = v;
    document.getElementById('vt-day').className  = 'vt-btn' + (v==='day'?' active':'');
    document.getElementById('vt-week').className = 'vt-btn' + (v==='week'?' active':'');
    window.renderCalendar();
  };

  window.shiftDay = (dir) => {
    dayOffset += calView === 'week' ? dir * 7 : dir;
    window.renderCalendar();
  };
  window.goToday = () => { dayOffset = 0; window.renderCalendar(); };

  // ---- Week render ----
  window.renderWeek = function() {
    const base = getSelectedDate();
    // Snap to Monday
    const dow = base.getDay(); // 0=Sun
    const monday = new Date(base);
    monday.setDate(base.getDate() - (dow === 0 ? 6 : dow - 1));

    const days = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(monday);
      d.setDate(monday.getDate() + i);
      days.push(d);
    }

    const todayYMD = toYMD(new Date());
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const DAY_SHORT = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

    // Title
    const m0 = months[days[0].getMonth()], m6 = months[days[6].getMonth()];
    const titleStr = days[0].getFullYear() === days[6].getFullYear() && m0 === m6
      ? m0 + ' ' + days[0].getDate() + ' – ' + days[6].getDate() + ', ' + days[0].getFullYear()
      : m0 + ' ' + days[0].getDate() + ' – ' + m6 + ' ' + days[6].getDate() + ', ' + days[6].getFullYear();
    document.getElementById('cal-title').textContent = titleStr;

    // Header row — 7 day columns
    const hdrGrid = document.getElementById('day-grid-header');
    hdrGrid.innerHTML = '';
    hdrGrid.style.gridTemplateColumns = '48px repeat(7, 1fr)';
    const corner = document.createElement('div');
    corner.style.cssText = 'width:48px;min-width:48px;';
    hdrGrid.appendChild(corner);
    days.forEach(d => {
      const ymd = toYMD(d);
      const hdr = document.createElement('div');
      hdr.className = 'week-day-header' + (ymd === todayYMD ? ' today' : '');
      hdr.innerHTML = '<div>' + DAY_SHORT[d.getDay()] + '</div><div style="font-size:13px;font-weight:500;">' + d.getDate() + '</div><div style="font-size:10px;opacity:0.6;">' + months[d.getMonth()] + '</div>';
      hdr.onclick = () => { dayOffset = Math.round((d - new Date(new Date().setHours(0,0,0,0))) / 86400000); setView('day'); };
      hdrGrid.appendChild(hdr);
    });

    // Body grid — 7 day columns
    const grid = document.getElementById('day-grid');
    grid.innerHTML = '';
    grid.style.gridTemplateColumns = '48px repeat(7, 1fr)';

    // Time gutter
    const gutter = document.createElement('div');
    gutter.className = 'time-gutter';
    for (let h = HOUR_START; h <= HOUR_END; h++) {
      const lbl = document.createElement('div');
      lbl.className = 'time-slot-label';
      lbl.textContent = h===12?'12pm':h<12?h+'am':(h-12)+'pm';
      gutter.appendChild(lbl);
    }
    grid.appendChild(gutter);

    days.forEach(d => {
      const ymd = toYMD(d);
      const isToday = ymd === todayYMD;
      const col = document.createElement('div');
      col.className = 'day-col';
      col.style.position = 'relative';
      if (isToday) col.style.background = '#fafffe';
      for (let h = HOUR_START; h <= HOUR_END; h++) {
        const cell = document.createElement('div');
        cell.className = 'hour-cell';
        col.appendChild(cell);
      }
      const dayEntries = allEntries.filter(e => e.date === ymd);
      dayEntries.forEach(e => {
        const startMins = timeToMins(e.start);
        const endMins   = timeToMins(e.end);
        const top    = (startMins - HOUR_START*60) / 60 * HOUR_HEIGHT;
        const height = Math.max((endMins - startMins) / 60 * HOUR_HEIGHT, 16);
        if (top < 0 || top > (HOUR_END - HOUR_START) * HOUR_HEIGHT) return;
        const cabStyle = CABINETS.find(x => x.name === e.cabinet) || { color:'#6b6a65', bg:'#f1efe8' };
        const block = document.createElement('div');
        block.className = 'booking-block';
        block.style.cssText = 'top:'+top+'px;height:'+height+'px;background:'+cabStyle.bg+';border-left:3px solid '+cabStyle.color+';left:2px;right:2px;';
        block.innerHTML = '<div class="bb-name" style="color:'+cabStyle.color+'">'+e.name+'</div><div class="bb-time" style="color:'+cabStyle.color+';font-size:9px;">'+formatTime(e.start)+'–'+formatTime(e.end)+'</div>';
        const tip = '<b>'+e.name+'</b><br>'+e.cabinet+'<br>'+formatTime(e.start)+' – '+formatTime(e.end)+(e.notes?'<br>'+e.notes:'')+'<br><span style="opacity:0.6;font-size:11px">Click to edit</span>';
        block.addEventListener('mouseenter', () => { tooltip.innerHTML=tip; tooltip.classList.add('show'); });
        block.addEventListener('mouseleave', () => tooltip.classList.remove('show'));
        block.addEventListener('click', () => { tooltip.classList.remove('show'); window._editEntry(e.fbKey); });
        col.appendChild(block);
      });
      if (isToday) {
        const now = new Date();
        const nowMins = now.getHours()*60+now.getMinutes();
        const nowTop = (nowMins-HOUR_START*60)/60*HOUR_HEIGHT;
        if (nowTop>=0 && nowTop<=(HOUR_END-HOUR_START)*HOUR_HEIGHT) {
          const line = document.createElement('div');
          line.className = 'now-line';
          line.style.top = nowTop+'px';
          line.innerHTML = '';
          col.appendChild(line);
        }
      }
      grid.appendChild(col);
    });

    const scrollEl = document.getElementById('cal-scroll');
    if (scrollEl.scrollTop === 0) scrollEl.scrollTop = (8-HOUR_START)*HOUR_HEIGHT;
    if (!scrollEl._syncBound) {
      scrollEl._syncBound = true;
      scrollEl.addEventListener('scroll', () => {
        document.getElementById('cal-header-row').scrollLeft = scrollEl.scrollLeft;
      });
    }
  };


  // ---- List render ----
  const LIST_PAGE = 5;
  let listShown = LIST_PAGE;

  function renderEntryCard(e) {
    return `<div class="entry-card">
        <div class="avatar">${getInitials(e.name)}</div>
        <div class="entry-body">
          <div class="entry-top">
            <span class="entry-name">${e.name}</span>
            <button class="delete-btn" onclick="window._deleteEntry('${e.fbKey}')">Remove</button>
            <button class="edit-btn" onclick="window._editEntry('${e.fbKey}')">Edit</button>
          </div>
          <div class="entry-meta">
            <span class="cabinet-tag" style="background:${cabStyle(e.cabinet).bg};color:${cabStyle(e.cabinet).color}">${e.cabinet}</span>
            <span class="meta-tag">${formatDate(e.date)}</span>
            <span class="meta-tag">${formatTime(e.start)} – ${formatTime(e.end)}</span>
          </div>
          ${e.notes?`<div class="entry-notes">${e.notes}</div>`:''}
        </div>
      </div>`;
  }

  window.renderList = function renderList(filter) {
    const f=(filter||'').toLowerCase();
    const filtered = allEntries.filter(e =>
      e.name.toLowerCase().includes(f) ||
      (e.cabinet||'').toLowerCase().includes(f) ||
      formatDate(e.date).toLowerCase().includes(f) ||
      (e.date||'').includes(f)
    );
    document.getElementById('total-label').textContent = allEntries.length+' entr'+(allEntries.length===1?'y':'ies');
    document.getElementById('count-pill').textContent = filtered.length;
    const list = document.getElementById('log-list');
    if (filtered.length===0) {
      listShown = LIST_PAGE;
      list.innerHTML = allEntries.length===0
        ? '<div class="empty-state"><strong>No bookings yet</strong>Use the form to add the first entry.</div>'
        : '<div class="empty-state"><strong>No results</strong>Try a different search.</div>';
      return;
    }
    const visible = filtered.slice(0, listShown);
    const remaining = filtered.length - visible.length;
    list.innerHTML = visible.map(renderEntryCard).join('') +
      (remaining > 0
        ? `<button onclick="window._showMore()" style="width:100%;margin-top:4px;padding:9px;font-size:13px;font-weight:500;border-radius:var(--radius-sm);border:1px solid var(--border);background:transparent;color:var(--text-muted);cursor:pointer;">Show ${Math.min(remaining, LIST_PAGE)} more <span style="opacity:0.5;">(${remaining} remaining)</span></button>`
        : (filtered.length > LIST_PAGE ? '<div style="text-align:center;font-size:12px;color:var(--text-hint);padding:8px 0;">All entries shown &nbsp;<button onclick="window._collapse()" style="font-size:12px;color:var(--text-hint);background:none;border:none;cursor:pointer;text-decoration:underline;">Collapse</button></div>' : ''));
  };

  window._showMore = function() {
    listShown += LIST_PAGE;
    window.renderList(document.querySelector('.search-input')?.value || '');
  };
  window._collapse = function() {
    listShown = LIST_PAGE;
    window.renderList(document.querySelector('.search-input')?.value || '');
  };

  // ---- Tab switching ----


  // ---- Firebase ----
  // Cutoff = 2 weeks ago
  const twoWeeksAgo = new Date();
  twoWeeksAgo.setDate(twoWeeksAgo.getDate() - 14);
  const cutoff = toYMD(twoWeeksAgo);

  // Auto-delete bookings older than 2 weeks (runs once on load)
  onValue(query(bookingsRef, orderByChild('date'), startAt('2000-01-01')), (snapshot) => {
    const data = snapshot.val();
    if (data) {
      Object.entries(data).forEach(([key, val]) => {
        if (val.date && val.date < cutoff) remove(ref(db, 'bookings/' + key));
      });
    }
  }, { onlyOnce: true });

  // Only load bookings from 2 weeks ago onward
  const recentQuery = query(bookingsRef, orderByChild('date'), startAt(cutoff));

  onValue(recentQuery, (snapshot) => {
    setStatus(true);
    const data = snapshot.val();
    allEntries = [];
    if (data) {
      Object.entries(data).forEach(([key,val]) => allEntries.push({fbKey:key,...val}));
      allEntries.sort((a,b) => (b.timestamp||0) - (a.timestamp||0));
    }
    document.getElementById('total-label').textContent = allEntries.length+' entr'+(allEntries.length===1?'y':'ies');
    window.renderCalendar();
    renderNowBanner();
    window.renderList(document.querySelector('.search-input')?.value||'');
  }, () => setStatus(false));

  window._deleteEntry = async (fbKey) => {
    if (!confirm('Remove this booking?')) return;
    await remove(ref(db, 'bookings/'+fbKey));
    showToast('Entry removed');
  };

  window.addEntry = async () => {
    const name    = document.getElementById('f-name').value.trim();
    const cabinet = document.getElementById('f-cabinet').value;
    const date    = document.getElementById('f-date').value;
    const start   = document.getElementById('f-start').value;
    const end     = document.getElementById('f-end').value;
    const notes   = document.getElementById('f-notes').value.trim();

    document.getElementById('err-name').style.display    = !name    ?'block':'none';
    document.getElementById('err-cabinet').style.display = !cabinet ?'block':'none';
    document.getElementById('err-date').style.display    = !date    ?'block':'none';
    document.getElementById('err-time').style.display    = (!start||!end)?'block':'none';
    if (!name||!cabinet||!date||!start||!end) return;

    const newStart=start.replace(':',''), newEnd=end.replace(':','');
    if (newEnd<=newStart) {
      document.getElementById('err-time').textContent='End must be after start';
      document.getElementById('err-time').style.display='block'; return;
    }
    document.getElementById('err-time').textContent='Required';

    const conflict = allEntries.find(e => {
      if (e.cabinet!==cabinet||e.date!==date) return false;
      const eS=e.start.replace(':',''), eE=e.end.replace(':','');
      return newStart<eE && newEnd>eS;
    });
    if (conflict) { showConflict(`${conflict.name} has booked ${cabinet} from ${formatTime(conflict.start)} to ${formatTime(conflict.end)}.`); return; }

    const btn=document.getElementById('submit-btn');
    btn.disabled=true; btn.textContent='Saving…';
    await push(bookingsRef,{name,cabinet,date,start,end,notes,timestamp:Date.now()});
    document.getElementById('f-name').value='';
    document.getElementById('f-cabinet').selectedIndex=0;
    document.getElementById('f-start').value='';
    document.getElementById('f-end').value='';
    document.getElementById('f-notes').value='';
    document.getElementById('conflict-banner').style.display='none';
    btn.disabled=false; btn.textContent='Add booking';
    showToast('Booking added — visible to everyone');
  };

  // Set today's date
  const t=new Date();
  document.getElementById('f-date').value=t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');

  function renderNowBanner() {
    const banner = document.getElementById('now-banner');
    if (!banner) return;
    const nowYMD = toYMD(new Date());
    const nowMins = new Date().getHours()*60 + new Date().getMinutes();
    const active = allEntries.filter(e => e.date === nowYMD && timeToMins(e.start) <= nowMins && timeToMins(e.end) > nowMins);
    if (active.length === 0) { banner.style.display = 'none'; return; }
    banner.style.display = 'block';
    banner.innerHTML = '<div class="now-banner-wrap">'+active.map(e => {
      const cab = CABINETS.find(x => x.name === e.cabinet) || { color:'#6b6a65', bg:'#f1efe8' };
      return '<span class="now-item" style="background:'+cab.bg+';color:'+cab.color+'"><span class="now-dot-pulse" style="background:'+cab.color+'"></span>'+e.name+' · '+e.cabinet+'</span>';
    }).join('')+'</div>';
  }

  // Refresh now-line every minute
  setInterval(window.renderCalendar, 60000);

  let editingKey = null;

  window._editEntry = (fbKey) => {
    const e = allEntries.find(x => x.fbKey === fbKey);
    if (!e) return;
    editingKey = fbKey;
    document.getElementById('edit-name').value    = e.name;
    document.getElementById('edit-cabinet').value = e.cabinet;
    document.getElementById('edit-date').value    = e.date;
    document.getElementById('edit-start').value   = e.start;
    document.getElementById('edit-end').value     = e.end;
    document.getElementById('edit-notes').value   = e.notes || '';
    document.getElementById('edit-conflict').style.display = 'none';
    document.getElementById('edit-modal-overlay').classList.add('open');
  };

  window._closeEditModal = () => {
    document.getElementById('edit-modal-overlay').classList.remove('open');
    editingKey = null;
  };

  window._deleteFromModal = async () => {
    if (!editingKey) return;
    if (!confirm('Remove this booking?')) return;
    await remove(ref(db, 'bookings/' + editingKey));
    window._closeEditModal();
    showToast('Booking removed');
  };

  window._saveEdit = async () => {
    const name    = document.getElementById('edit-name').value.trim();
    const cabinet = document.getElementById('edit-cabinet').value;
    const date    = document.getElementById('edit-date').value;
    const start   = document.getElementById('edit-start').value;
    const end     = document.getElementById('edit-end').value;
    const notes   = document.getElementById('edit-notes').value.trim();
    if (!name || !cabinet || !date || !start || !end) return;

    const newStart = start.replace(':',''), newEnd = end.replace(':','');
    if (newEnd <= newStart) {
      document.getElementById('edit-conflict').textContent = 'End time must be after start time';
      document.getElementById('edit-conflict').style.display = 'block';
      return;
    }

    const conflict = allEntries.find(e => {
      if (e.fbKey === editingKey) return false;
      if (e.cabinet !== cabinet || e.date !== date) return false;
      const eS = e.start.replace(':',''), eE = e.end.replace(':','');
      return newStart < eE && newEnd > eS;
    });
    if (conflict) {
      document.getElementById('edit-conflict').textContent = `${conflict.name} has already booked this cabinet from ${formatTime(conflict.start)} to ${formatTime(conflict.end)}.`;
      document.getElementById('edit-conflict').style.display = 'block';
      return;
    }

    await update(ref(db, 'bookings/' + editingKey), { name, cabinet, date, start, end, notes });
    window._closeEditModal();
    showToast('Booking updated');
  };

  document.getElementById('edit-modal-overlay').addEventListener('click', (e) => {
    if (e.target === document.getElementById('edit-modal-overlay')) window._closeEditModal();
  });
</script>
</body>
</html>
